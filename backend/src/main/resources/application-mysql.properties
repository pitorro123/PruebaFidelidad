spring.application.name=PruebaFidelidadBack
server.port=8080
server.error.include-message=always

# ===== Perfil MySQL =====
# Pre-requisito: ejecutar una vez src/main/resources/db/setup-mysql.sql
# (crea la base "fidelidad" y el usuario) o crear la BD manualmente.
# Credenciales se pueden sobreescribir por variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/fidelidad?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fidelidad123}

# El esquema y los datos se cargan desde scripts SQL (evidencia del diseno)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/mysql-schema.sql
spring.sql.init.data-locations=classpath:db/mysql-data.sql

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html