spring.application.name=PruebaFidelidadBack
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/fidelidad?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fidelidad123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/mysql-schema.sql
spring.sql.init.data-locations=classpath:db/mysql-data.sql
springdoc.swagger-ui.path=/swagger-ui.html