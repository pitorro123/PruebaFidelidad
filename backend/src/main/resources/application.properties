spring.application.name=PruebaFidelidadBack
server.port=8080
server.error.include-message=always

# ===== Perfil por defecto: H2 EN MEMORIA =====
# No requiere instalar nada. Los catalogos se cargan en CargaDatosIniciales.
# Para MySQL: ejecutar el script db/setup-mysql.sql una vez y luego
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:h2:mem:fidelidad;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola web de H2 =====
# Disponible en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html