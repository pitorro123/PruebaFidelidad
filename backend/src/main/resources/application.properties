spring.application.name=PruebaFidelidadBack
server.port=8080

# ===== Variables secretas desde archivo .env (no se versiona) =====
# El archivo backend/.env define MAIL_USERNAME y MAIL_PASSWORD
spring.config.import=optional:file:.env[.properties]

# ===== Email SMTP (Gmail) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== Perfil por defecto: H2 EN MEMORIA =====
# No requiere instalar nada. Los catalogos se cargan en CargaDatosIniciales.
# Para MySQL: ejecutar el script db/setup-mysql.sql una vez y luego
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:h2:mem:fidelidad;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola web de H2 =====
# Disponible en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html